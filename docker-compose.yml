version: '3.8'

services:
  db:
    image: ankane/pgvector:v0.5.1
    environment:
      POSTGRES_DB: autoscout
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  web:
    build: .
    command: uvicorn backend.app:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/autoscout
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - TELEGRAM_PROXY=${TELEGRAM_PROXY}
      - CHECKO_API_KEY=${CHECKO_API_KEY}
      - LLM_API_KEY=${LLM_API_KEY}
      - GIGACHAT_API_TOKEN=${GIGACHAT_API_TOKEN}
      - SMTP_SERVER=${SMTP_SERVER}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMS_API_KEY=${SMS_API_KEY}
    depends_on:
      - db
    restart: unless-stopped

  bot:
    build: .
    command: python bot.py
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/autoscout
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - TELEGRAM_PROXY=${TELEGRAM_PROXY}
      - CHECKO_API_KEY=${CHECKO_API_KEY}
      - LLM_API_KEY=${LLM_API_KEY}
      - GIGACHAT_API_TOKEN=${GIGACHAT_API_TOKEN}
      - SMTP_SERVER=${SMTP_SERVER}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMS_API_KEY=${SMS_API_KEY}
    depends_on:
      - db
    restart: unless-stopped

volumes:
  postgres_data: